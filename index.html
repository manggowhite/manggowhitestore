<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manggo White Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef5ff;
color:#1f2937;
}

.page{
display:none;
max-width:900px;
margin:auto;
padding:15px;
}

.active{
display:block;
animation:fade .3s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.banner{
width:100%;
border-radius:25px;
display:block;
margin-bottom:15px;
box-shadow:0 8px 25px rgba(80,130,255,.15);
}

.main-btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#78a8ff,#5b8cff);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
box-shadow:0 10px 25px rgba(91,140,255,.25);
}

.main-btn:active{
transform:scale(.98);
}

.menu{
display:none;
margin-top:15px;
}

.menu button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:white;
margin-bottom:12px;
font-size:15px;
font-weight:600;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,.05);
color:#3b82f6;
}

.back-btn{
width:100%;
padding:14px;
border:none;
border-radius:16px;
background:#1e293b;
color:white;
margin-bottom:15px;
cursor:pointer;
font-weight:600;
}

.title{
font-size:24px;
font-weight:700;
margin-bottom:15px;
color:#3b82f6;
}

.card{
background:white;
border-radius:24px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.card img{
width:100%;
display:block;
}

.content{
padding:18px;
}

.product-title{
font-size:18px;
font-weight:700;
margin-bottom:8px;
}

.price{
font-size:18px;
font-weight:700;
color:#4f7cff;
margin-bottom:12px;
}

.order-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#78a8ff,#5b8cff);
color:white;
font-weight:600;
cursor:pointer;
}

.select-box{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #dbeafe;
background:#f8fbff;
margin:12px 0;
font-size:14px;
outline:none;
}

.section-card{
background:white;
padding:18px;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.section-card h3{
margin-bottom:10px;
color:#3b82f6;
}

.footer-space{
height:20px;
}

</style>
</head>
<body>

<!-- HOME -->

<div class="page active" id="home">

<img class="banner"
src="https://i.postimg.cc/P5qnb41S/IMG-20260528-WA0086.jpg">

<img class="banner"
src="https://i.postimg.cc/25VqtnNc/IMG-20260528-WA0096.jpg">

<button class="main-btn" onclick="toggleProduk()">
Lihat Produk
</button>

<div class="menu" id="produkMenu">

<button onclick="showPage('design')">
Design Custom
</button>

<button onclick="showPage('panel')">
Panel & Sewa Bot
</button>

</div>

</div>

<!-- DESIGN -->

<div class="page" id="design">

<button class="back-btn" onclick="showPage('home')">
Kembali
</button>

<div class="title">
Design Custom
</div>

<div class="card">

<img src="https://i.postimg.cc/tCCM8g71/IMG-20260528-WA0107.jpg">

<div class="content">

<div class="product-title">
QR Deco
</div>

<div class="price">
Rp 6.000
</div>

<button class="order-btn"
onclick="orderProduk('QR Deco - Rp 6.000')">
Order Sekarang
</button>

</div>

</div>

<div class="card">

<img src="https://i.postimg.cc/sXscSnh9/file-000000002e5471fdb16fbfe95eccd714.png">

<div class="content">

<div class="product-title">
Custom Profile
</div>

<div class="price">
Rp 8.000
</div>

<button class="order-btn"
onclick="orderProduk('Custom Profile - Rp 8.000')">
Order Sekarang
</button>

</div>

</div>

<div class="card">

<img src="https://i.postimg.cc/wTyhtKGN/Tak-berjudul109-20260528221109.png">

<div class="content">

<div class="product-title">
Custom Banner
</div>

<div class="price">
Rp 8.000
</div>

<button class="order-btn"
onclick="orderProduk('Custom Banner - Rp 8.000')">
Order Sekarang
</button>

</div>

</div>

</div>

<!-- PANEL -->

<div class="page" id="panel">

<button class="back-btn" onclick="showPage('home')">
Kembali
</button>

<div class="title">
Panel & Sewa Bot
</div>

<div class="section-card">

<h3>Sewa Bot WhatsApp</h3>

<select id="botSelect" class="select-box">

<option>1 Bulan - Rp 10.000</option>
<option>2 Bulan - Rp 15.000</option>
<option>3 Bulan - Rp 20.000</option>
<option>4 Bulan - Rp 25.000</option>
<option>5 Bulan - Rp 30.000</option>
<option>Permanent - Rp 55.000</option>

</select>

<button class="order-btn"
onclick="orderBot()">
Order Sekarang
</button>

</div>

<div class="section-card">

<h3>Panel Pterodactyl</h3>

<select id="panelSelect" class="select-box">

<option>1GB - Rp 1.000</option>
<option>2GB - Rp 2.000</option>
<option>3GB - Rp 3.000</option>
<option>4GB - Rp 4.000</option>
<option>5GB - Rp 5.000</option>
<option>6GB - Rp 6.000</option>
<option>7GB - Rp 7.000</option>
<option>8GB - Rp 8.000</option>
<option>9GB - Rp 9.000</option>
<option>10GB - Rp 10.000</option>
<option>Unlimited - Rp 11.000</option>

</select>

<button class="order-btn"
onclick="orderPanel()">
Order Sekarang
</button>

</div>

<div class="footer-space"></div>

</div>

<script>

function toggleProduk(){

const menu = document.getElementById("produkMenu");

if(menu.style.display==="block"){
menu.style.display="none";
}else{
menu.style.display="block";
}

}

function showPage(id){

document.querySelectorAll(".page").forEach(page=>{
page.classList.remove("active");
});

document.getElementById(id).classList.add("active");

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function orderProduk(nama){

const pesan =
encodeURIComponent(
"Halo, saya ingin order:\n\n"+nama
);

window.open(
"https://t.me/manggowhite_bot?start=start",
"_blank"
);

}

function orderBot(){

const pilihan =
document.getElementById("botSelect").value;

window.open(
"https://t.me/manggowhite_bot?start=start",
"_blank"
);

}

function orderPanel(){

const pilihan =
document.getElementById("panelSelect").value;

window.open(
"https://t.me/manggowhite_bot?start=start",
"_blank"
);

}

</script>

</body>

<div id="loading-screen" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(180deg,#eef5ff,#dbeafe);
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
transition:.5s;
">

<div style="text-align:center;">

<img src="https://i.postimg.cc/qR919MGs/1000435941-removebg-preview.png"
style="
width:140px;
height:140px;
object-fit:contain;
animation:float 2s infinite ease-in-out;
">

<h2 style="
margin-top:10px;
color:#5b8cff;
font-family:Poppins,sans-serif;
font-size:24px;
">
Manggo White
</h2>

<p style="
color:#6b7280;
font-family:Poppins,sans-serif;
">
Loading...
</p>

<div style="
width:220px;
height:10px;
background:white;
border-radius:50px;
overflow:hidden;
margin-top:15px;
">

<div id="loadingBar"
style="
height:100%;
width:0%;
background:linear-gradient(90deg,#8bb5ff,#5b8cff);
border-radius:50px;
transition:1.5s;
">
</div>

</div>

</div>

</div>

<style>
@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-10px);
}
}
</style>

<script>

window.onload=function(){

showLoading();

setTimeout(function(){
hideLoading();
},2000);

};

function showLoading(){

document.getElementById("loading-screen").style.display="flex";

setTimeout(function(){
document.getElementById("loadingBar").style.width="100%";
},100);

}

function hideLoading(){

document.getElementById("loading-screen").style.opacity="0";

setTimeout(function(){

document.getElementById("loading-screen").style.display="none";
document.getElementById("loading-screen").style.opacity="1";
document.getElementById("loadingBar").style.width="0%";

},500);

}

function showPage(id){

showLoading();

setTimeout(function(){

document.querySelectorAll(".page").forEach(page=>{
page.classList.remove("active");
});

document.getElementById(id).classList.add("active");

window.scrollTo(0,0);

hideLoading();

},1200);

}

</script>
</html>
